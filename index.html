<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>石榴小司机成长探索工作台</title>
<style>
:root {
  --sky: #E8F4FD;
  --cream: #FFFAF5;
  --haze: #A8C8E0;
  --yellow: #FFD54F;
  --sky-deep: #B8D8F0;
  --text: #3A4A5C;
  --text-light: #6B8299;
  --border: #E0E8EF;
  --card-bg: #FFFFFF;
  --card-shadow: 0 2px 12px rgba(160,180,200,0.15);
  --radius: 18px;
  --menu-width: 220px;
  --menu-bg: #F5F9FD;
  --menu-active: #D8ECFA;
  --menu-hover: #EEF5FB;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: var(--cream);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  overflow: hidden;
  position: relative;
}

/* === 暗纹背景层 === */
.bg-pattern {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  z-index: 0;
  pointer-events: none;
  opacity: 0.06;
  overflow: hidden;
}
.bg-pattern svg { width: 100%; height: 100%; }

/* === 左侧菜单栏 === */
.sidebar {
  width: var(--menu-width);
  min-width: var(--menu-width);
  background: var(--menu-bg);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  z-index: 10;
  position: relative;
}
.sidebar-header {
  padding: 20px 16px 14px;
  text-align: center;
  border-bottom: 1px solid var(--border);
}
.sidebar-header .logo-icon { font-size: 32px; margin-bottom: 4px; }
.sidebar-header h2 {
  font-size: 15px;
  color: var(--text);
  font-weight: 700;
  letter-spacing: 1px;
}
.sidebar-header .subtitle {
  font-size: 10px;
  color: var(--text-light);
  margin-top: 2px;
}
.sidebar-nav {
  flex: 1;
  overflow-y: auto;
  padding: 8px 0;
}
.sidebar-nav::-webkit-scrollbar { width: 3px; }
.sidebar-nav::-webkit-scrollbar-thumb { background: #d0d8e0; border-radius: 3px; }

.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 16px;
  cursor: pointer;
  transition: all 0.2s;
  font-size: 13px;
  color: var(--text);
  border-left: 3px solid transparent;
  margin: 1px 0;
  user-select: none;
}
.nav-item:hover { background: var(--menu-hover); }
.nav-item.active {
  background: var(--menu-active);
  border-left-color: #5BA4D6;
  font-weight: 600;
  color: #2C6A9E;
}
.nav-item .nav-icon { font-size: 18px; width: 24px; text-align: center; flex-shrink: 0; }
.nav-item .nav-label { line-height: 1.3; }

.sidebar-footer {
  padding: 12px 16px;
  border-top: 1px solid var(--border);
  font-size: 10px;
  color: var(--text-light);
  text-align: center;
}

/* === 主内容区 === */
.main-content {
  flex: 1;
  overflow-y: auto;
  padding: 24px 28px;
  z-index: 5;
  position: relative;
  height: 100vh;
}
.main-content::-webkit-scrollbar { width: 6px; }
.main-content::-webkit-scrollbar-thumb { background: #c8d6e0; border-radius: 6px; }

/* === 通用卡片 === */
.card {
  background: var(--card-bg);
  border-radius: var(--radius);
  border: 1px solid var(--border);
  box-shadow: var(--card-shadow);
  padding: 20px 24px;
  margin-bottom: 16px;
}
.card-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 14px;
  padding-bottom: 12px;
  border-bottom: 1px solid #f0f4f8;
}
.card-header .icon { font-size: 26px; }
.card-header h3 { font-size: 17px; font-weight: 700; color: var(--text); }
.card-header .badge {
  font-size: 11px;
  background: var(--sky);
  color: #3A7AB5;
  padding: 3px 10px;
  border-radius: 12px;
  margin-left: auto;
}

.section-title {
  font-size: 14px;
  font-weight: 700;
  color: var(--text);
  margin: 16px 0 10px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.section-title::before {
  content: '';
  display: inline-block;
  width: 4px;
  height: 16px;
  background: var(--yellow);
  border-radius: 2px;
}

/* === 计划表 === */
.plan-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
  margin: 8px 0 14px;
}
.plan-table th {
  background: #F0F6FB;
  padding: 8px 10px;
  text-align: left;
  font-weight: 600;
  color: #3A7AB5;
  border-bottom: 2px solid #D8ECFA;
}
.plan-table td {
  padding: 7px 10px;
  border-bottom: 1px solid #f0f4f8;
  color: var(--text);
}
.plan-table tr:hover td { background: #FAFCFE; }
.plan-table .phase-tag {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 8px;
  font-size: 10px;
  font-weight: 600;
}
.phase-tag.p1 { background: #E8F4FD; color: #3A7AB5; }
.phase-tag.p2 { background: #FFF8E1; color: #B8860B; }
.phase-tag.p3 { background: #E8F5E9; color: #388E3C; }

/* === 表单组件 === */
.form-group { margin-bottom: 12px; }
.form-label {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 6px;
}
.form-label .dot {
  width: 6px; height: 6px;
  background: var(--yellow);
  border-radius: 50%;
}

input[type="date"], input[type="text"], input[type="number"], select {
  padding: 8px 12px;
  border: 1px solid var(--border);
  border-radius: 10px;
  font-size: 13px;
  width: 100%;
  max-width: 300px;
  background: #FAFCFE;
  color: var(--text);
  transition: border 0.2s;
}
input:focus, select:focus {
  outline: none;
  border-color: #5BA4D6;
  box-shadow: 0 0 0 3px rgba(91,164,214,0.1);
}
textarea {
  padding: 8px 12px;
  border: 1px solid var(--border);
  border-radius: 10px;
  font-size: 13px;
  width: 100%;
  max-width: 400px;
  resize: vertical;
  min-height: 50px;
  background: #FAFCFE;
  font-family: inherit;
}
textarea:focus { outline: none; border-color: #5BA4D6; }

/* === 勾选任务网格 === */
.task-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 8px;
  margin: 6px 0 12px;
}
.task-check {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  background: #FAFCFE;
  border: 1px solid var(--border);
  border-radius: 10px;
  cursor: pointer;
  transition: all 0.2s;
  font-size: 13px;
  user-select: none;
}
.task-check:hover { border-color: #A8C8E0; background: #F5FAFE; }
.task-check.checked {
  background: #E8F6ED;
  border-color: #81C784;
  color: #2E7D32;
}
.task-check input[type="checkbox"] { display: none; }
.task-check .check-box {
  width: 20px; height: 20px;
  border: 2px solid #c8d6e0;
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: all 0.2s;
}
.task-check.checked .check-box {
  background: #66BB6A;
  border-color: #66BB6A;
}
.task-check.checked .check-box::after {
  content: '✓';
  color: #fff;
  font-size: 12px;
  font-weight: 700;
}

/* === 星级评分 === */
.star-rating {
  display: flex;
  gap: 6px;
  cursor: pointer;
}
.star-rating .star {
  font-size: 28px;
  color: #d0d8e0;
  transition: all 0.2s;
  user-select: none;
}
.star-rating .star.active { color: var(--yellow); }
.star-rating .star:hover { transform: scale(1.2); }

/* === 单选组 === */
.radio-group {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.radio-option {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 7px 14px;
  border: 1px solid var(--border);
  border-radius: 20px;
  cursor: pointer;
  font-size: 12px;
  transition: all 0.2s;
  user-select: none;
}
.radio-option:hover { border-color: #A8C8E0; }
.radio-option.selected {
  background: #E8F4FD;
  border-color: #5BA4D6;
  color: #2C6A9E;
  font-weight: 600;
}
.radio-option input { display: none; }

/* === 按钮 === */
.btn {
  padding: 9px 20px;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  border: none;
  transition: all 0.2s;
}
.btn-primary {
  background: #5BA4D6;
  color: #fff;
}
.btn-primary:hover { background: #4A93C5; }
.btn-outline {
  background: #fff;
  border: 1px solid #5BA4D6;
  color: #5BA4D6;
}
.btn-outline:hover { background: #E8F4FD; }
.btn-sm { padding: 5px 12px; font-size: 11px; }
.btn-yellow { background: var(--yellow); color: #5D4037; }
.btn-yellow:hover { background: #FFC107; }

.btn-row { display: flex; gap: 8px; margin-top: 12px; }

.btn-action {
  padding: 8px 18px;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  border: 1px dashed #5BA4D6;
  background: #fff;
  color: #5BA4D6;
  transition: all 0.2s;
}
.btn-action:hover { background: #E8F4FD; border-style: solid; }
.btn-edit, .btn-del {
  background: none;
  border: none;
  font-size: 15px;
  cursor: pointer;
  padding: 2px 6px;
  border-radius: 6px;
  transition: background 0.15s;
}
.btn-edit:hover { background: #E8F4FD; }
.btn-del:hover { background: #FFE8E8; }
.btn-save {
  padding: 9px 24px;
  border-radius: 10px;
  background: #5BA4D6;
  color: #fff;
  border: none;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.2s;
}
.btn-save:hover { background: #4A93C5; }
.btn-cancel {
  padding: 9px 24px;
  border-radius: 10px;
  background: #f0f0f0;
  color: #666;
  border: none;
  font-size: 14px;
  cursor: pointer;
  margin-right: 10px;
}
.btn-cancel:hover { background: #e0e0e0; }

/* === 弹窗 === */
.modal-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.35);
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: center;
}
.modal-box {
  background: #fff;
  border-radius: 16px;
  width: 420px;
  max-width: 90vw;
  box-shadow: 0 8px 40px rgba(0,0,0,0.18);
  overflow: hidden;
}
.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
  background: #F8FBFD;
}
.modal-header h3 { font-size: 16px; margin: 0; }
.modal-close {
  background: none;
  border: none;
  font-size: 18px;
  cursor: pointer;
  color: #999;
  padding: 2px 6px;
  border-radius: 4px;
}
.modal-close:hover { background: #eee; color: #333; }
.modal-body {
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.modal-body label {
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  margin-top: 8px;
}
.modal-body label:first-child { margin-top: 0; }
.modal-body input, .modal-body select {
  padding: 9px 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 14px;
  outline: none;
  transition: border-color 0.2s;
}
.modal-body input:focus, .modal-body select:focus { border-color: #5BA4D6; }
.modal-footer {
  padding: 14px 20px;
  border-top: 1px solid var(--border);
  text-align: right;
  background: #FAFAFA;
}

.vax-row { cursor: pointer; transition: background 0.15s; }
.vax-row:hover { background: #F0F7FC; }

/* === 书单管理 === */
.booklist-panel {
  background: #F8FBFD;
  border-radius: 12px;
  padding: 14px;
  margin: 10px 0;
  border: 1px dashed #c8d6e0;
}
.booklist-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 10px;
  margin: 3px 0;
  background: #fff;
  border-radius: 8px;
  font-size: 12px;
  border: 1px solid #f0f4f8;
}
.booklist-item .book-status {
  font-size: 10px;
  padding: 2px 8px;
  border-radius: 6px;
  margin-left: auto;
}
.book-status.new { background: #E8F4FD; color: #3A7AB5; }
.book-status.old { background: #FFF8E1; color: #B8860B; }

.add-book-row {
  display: flex;
  gap: 8px;
  margin-top: 8px;
  align-items: center;
}
.add-book-row input {
  flex: 1;
  max-width: 250px;
}

/* === 公告区 === */
.announce-card {
  background: linear-gradient(135deg, #F8FBFD 0%, #EEF5FB 100%);
  border: 1px solid #D8ECFA;
}
.announce-card h2 {
  font-size: 16px;
  margin-bottom: 12px;
  color: #2C6A9E;
}
.announce-card ol {
  padding-left: 20px;
  font-size: 13px;
  line-height: 1.8;
  color: var(--text);
}
.announce-card ol li { margin-bottom: 4px; }

/* === 使用规则高亮 === */
.rule-highlight {
  background: #FFF8E1;
  border-left: 4px solid var(--yellow);
  padding: 12px 16px;
  border-radius: 0 10px 10px 0;
  margin: 12px 0;
  font-size: 12px;
  line-height: 1.7;
}

/* === 隐藏/显示 === */
.hidden { display: none !important; }

/* === 打卡记录列表 === */
.record-list {
  margin-top: 10px;
}
.record-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 12px;
  border-bottom: 1px solid #f0f4f8;
  font-size: 12px;
}
.record-item .record-date { font-weight: 600; min-width: 90px; }
.record-item .record-status {
  padding: 2px 8px;
  border-radius: 8px;
  font-size: 10px;
}
.record-status.full { background: #E8F5E9; color: #388E3C; }
.record-status.partial { background: #FFF8E1; color: #B8860B; }
.record-status.none { background: #FFEBEE; color: #C62828; }

/* === 响应式 === */
@media (max-width: 900px) {
  .sidebar { width: 70px; min-width: 70px; }
  .sidebar-header h2, .sidebar-header .subtitle { display: none; }
  .nav-item .nav-label { display: none; }
  .nav-item { justify-content: center; padding: 12px; }
  .main-content { padding: 16px; }
}

/* === 动画 === */
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
.module-panel { animation: fadeIn 0.3s ease; }
</style>
</head>

<!-- 左侧菜单栏 -->
<aside class="sidebar">
  <div class="sidebar-header">
    <div class="logo-icon">🚗</div>
    <h2>石榴小司机</h2>

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// 通用弹窗：fields = [{label, id, type, value, placeholder?, step?, options?}], onSave 返回 true 则关闭
function showModal(title, fields, onSave) {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  const fieldHtml = fields.map(f => {
    let input;
    if (f.type === 'select' && f.options) {
      input = `<select id="${f.id}">${f.options.map(o => `<option value="${escHtml(o)}" ${o===f.value?'selected':''}>${escHtml(o)}</option>`).join('')}</select>`;
    } else if (f.type === 'date') {
      input = `<input type="date" id="${f.id}" value="${f.value||''}">`;
    } else if (f.type === 'number') {
      input = `<input type="number" id="${f.id}" value="${f.value||''}" step="${f.step||'1'}" placeholder="${escHtml(f.placeholder||'')}">`;
    } else {
      input = `<input type="text" id="${f.id}" value="${escHtml(f.value||'')}" placeholder="${escHtml(f.placeholder||'')}">`;
    }
    return `<label>${f.label}${f.required?' <span style="color:#e88;">*</span>':''}</label>${input}`;
  }).join('');

  overlay.innerHTML = `
    <div class="modal-box">
      <div class="modal-header">
        <h3>${title}</h3>
        <button class="modal-close" onclick="this.closest('.modal-overlay').remove()">✕</button>
      </div>
      <div class="modal-body">${fieldHtml}</div>
      <div class="modal-footer">
        <button class="btn-cancel" onclick="this.closest('.modal-overlay').remove()">取消</button>
        <button class="btn-save" id="modalSaveBtn">💾 保存</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.addEventListener('click', function(e) { if (e.target === overlay) overlay.remove(); });
  document.getElementById('modalSaveBtn').addEventListener('click', function() {
    if (onSave() !== false) overlay.remove();
  });
  // 回车保存
  overlay.addEventListener('keydown', function(e) { if (e.key === 'Enter') { document.getElementById('modalSaveBtn').click(); } });
}

    {label:'身高 (cm)', id:'editHeight', type:'number', value:r.height, step:'0.1'},
    {label:'体重 (kg)', id:'editWeight', type:'number', value:r.weight, step:'0.1'},
  ], () => {
    const date = document.getElementById('editDate').value;
    const height = parseFloat(document.getElementById('editHeight').value);
    const weight = parseFloat(document.getElementById('editWeight').value);
    if (!date || isNaN(height) || isNaN(weight)) { alert('请填写完整信息'); return false; }

    const idx = list.findIndex(x => x.id === id);

    list[idx] = { ...list[idx], date, height, weight };
    saveGrowthRecords(list);
    switchModule('growth');

  `;
}

function editTravel(id) {
  const trips = getTravels();
  const t = trips.find(x => x.id === id);
  if (!t) return;
  showModal('✏️ 编辑旅行记录', [
    {label:'日期', id:'editDate', type:'date', value:t.date},
    {label:'目的地', id:'editCity', type:'text', value:t.city, placeholder:'如：北京'},
    {label:'旅行故事', id:'editStory', type:'text', value:t.story, placeholder:'旅行中的趣事...'},
  ], () => {
    const date = document.getElementById('editDate').value;
    const city = document.getElementById('editCity').value.trim();
    const story = document.getElementById('editStory').value.trim();
    if (!date || !city) { alert('请填写日期和目的地'); return false; }
    const list = getTravels();
    const idx = list.findIndex(x => x.id === id);
    if (idx === -1) return false;
    list[idx] = { ...list[idx], date, city, story };
    saveTravels(list);
    switchModule('travel');
    return true;
  });
}

function addTravelRecord() {
  showModal('➕ 新增旅行记录', [
    {label:'日期', id:'editDate', type:'date', value:today()},
    {label:'目的地', id:'editCity', type:'text', value:'', placeholder:'如：杭州'},
    {label:'旅行故事', id:'editStory', type:'text', value:'', placeholder:'旅行中的趣事...'},
  ], () => {
    const date = document.getElementById('editDate').value;
    const city = document.getElementById('editCity').value.trim();
    const story = document.getElementById('editStory').value.trim();
    if (!date || !city) { alert('请填写日期和目的地'); return false; }
    const list = getTravels();
    list.push({ id:'t'+Date.now(), date, city, story });
    saveTravels(list);
    switchModule('travel');
    return true;
  });
}

function deleteTravel(id) {
  if (!confirm('确定删除这条旅行记录吗？')) return;
  let list = getTravels();
  list = list.filter(x => x.id !== id);
  saveTravels(list);
  switchModule('travel');
}

// ============ 工具函数 ============
function today() {
  return new Date().toISOString().split('T')[0];
}

function toggleTask(el) {
  el.classList.toggle('checked');
}

function selectRadio(el) {
  const group = el.parentElement;
  group.querySelectorAll('.radio-option').forEach(r => r.classList.remove('selected'));
  el.classList.add('selected');
}

function setStars(containerId, n) {
  const container = document.getElementById(containerId);
  if (!container) return;
  container.querySelectorAll('.star').forEach((s, i) => {
    s.classList.toggle('active', i < n);
  });
  container.dataset.value = n;
}

function getCheckedTasks(containerId) {
  const container = document.getElementById(containerId);
  if (!container) return [];
  return Array.from(container.querySelectorAll('.task-check.checked')).map(el => el.querySelector('span').textContent);
}

function getRadioValue(containerId) {
  const container = document.getElementById(containerId);
  if (!container) return '';
  const sel = container.querySelector('.radio-option.selected');
  return sel ? sel.textContent.trim() : '';
}

function getStarsValue(containerId) {
  const container = document.getElementById(containerId);
  if (!container) return 0;
  return parseInt(container.dataset.value || '0');
}

// ============ 书单管理 ============
function addBook(type) {
  const inputId = type === 'english' ? 'englishBookInput' : 'chineseBookInput';
  const input = document.getElementById(inputId);
  if (!input || !input.value.trim()) return;
  const books = getBookList(type);
  books.push(input.value.trim());
  saveBookList(type, books);
  input.value = '';
  switchModule(currentModule);
}

function removeBook(type, index) {
  const books = getBookList(type);
  books.splice(index, 1);
  saveBookList(type, books);
  switchModule(currentModule);
}

function autoScheduleBooks(books, newCount, oldCount, isChinese = false) {
  if (books.length === 0) return [];
  const data = loadData();
  const key = isChinese ? 'chinese_read_ptr' : 'english_read_ptr';
  let ptr = data[key] || 0;
  const schedule = [];
  // 从ptr开始取newCount本新书
  for (let i = 0; i < newCount && i < books.length; i++) {
    schedule.push(books[(ptr + i) % books.length]);
  }
  // 旧书从之前读过的取
  const oldStart = Math.max(0, ptr - oldCount);
  for (let i = 0; i < oldCount && (oldStart + i) < ptr; i++) {
    schedule.push(books[(oldStart + i) % books.length]);
  }
  // 更新指针
  const newPtr = (ptr + newCount) % books.length;
  if (newPtr === 0 && ptr > 0) {
    // 一轮读完，重置
  }
  saveData(key, newPtr);
  return schedule;
}

// ============ 保存函数 ============
function saveCheckin(moduleId, fields) {
  const records = getCheckins(moduleId);
  records.unshift({ ...fields, time: new Date().toISOString() });
  if (records.length > 50) records.length = 50; // 限制50条
  saveCheckins(moduleId, records);
  switchModule(moduleId);
}

function renderRecords(containerId, moduleId, renderFn) {
  const container = document.getElementById(containerId);

  const records = getCheckins(moduleId);
  if (records.length === 0) {
    container.innerHTML = '<p style="font-size:12px;color:var(--text-light);">暂无记录</p>';
    return;
  }
  container.innerHTML = records.map(r => renderFn(r)).join('');
}

function renderHomeSummary() {
  const summary = document.getElementById('homeSummary');
  if (!summary) return;
  const modules = ['english','reading','math','general','sports','fineMotor','selfCare','play'];
  const todayStr = today();
  let html = '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;">';
  const labels = {english:'英语启蒙',reading:'中文绘本',math:'数感启蒙',general:'通识学习',sports:'大运动',fineMotor:'精细动作',selfCare:'生活自理',play:'早教陪玩'};
  modules.forEach(m => {
    const records = getCheckins(m);
    const todayRecord = records.find(r => r.date === todayStr);
    const done = todayRecord ? (todayRecord.status === '全部完成' ? '✅' : todayRecord.status === '部分完成' ? '⏳' : '❌') : '⬜';
    html += `<div style="padding:8px 12px;background:#FAFCFE;border-radius:10px;border:1px solid var(--border);">
      <strong>${labels[m]}</strong> <span style="float:right;">${done}</span><br>
      <span style="font-size:11px;color:var(--text-light);">${todayRecord ? (todayRecord.tasks||[]).length+'项任务完成' : '今日未打卡'}</span>
    </div>`;
  });
  html += '</div>';
  summary.innerHTML = html;
}
